name: Publish PDF

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compile PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Prepare GitHub Pages content
        run: |
          mkdir -p public
          cp main.pdf public/alg1.pdf
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="es">
            <head>
              <meta charset="utf-8">
              <meta http-equiv="refresh" content="0; url=alg1.pdf">
              <title>Álgebra Lineal y Geometría I</title>
            </head>
            <body>
              <p><a href="alg1.pdf">Abrir el PDF de Álgebra Lineal y Geometría I</a></p>
            </body>
          </html>
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
